<script>
(function(){
var T=JSON.parse(document.getElementById('testata').textContent), CH='nls-chiave-'+T.sale;
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function chiaveDa(pw){var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(T.sale),iterations:T.iter},k,256));}
async function apri(grezza){
 var k=await crypto.subtle.importKey('raw',grezza,'AES-GCM',false,['decrypt']);
 var chiaro=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(T.iv)},k,b64(document.getElementById('dati').textContent.trim()));
 var flusso=new Blob([chiaro]).stream().pipeThrough(new DecompressionStream('gzip'));
 return await new Response(flusso).text();}
function mostra(testo){document.open();document.write(testo);document.close();}
function salvata(){try{var s=localStorage.getItem(CH);return s?b64(s):null;}catch(e){return null;}}
var s=salvata(); if(s){apri(s).then(mostra).catch(function(){try{localStorage.removeItem(CH);}catch(e){}});}
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();
 var err=document.getElementById('err');err.textContent='Apro…';
 if(!window.crypto||!crypto.subtle||!window.DecompressionStream){err.textContent='Questo browser è troppo vecchio per aprire la pagina.';return;}
 var ricorda=document.getElementById('ric').checked, testo;
 try{var g=await chiaveDa(document.getElementById('pw').value);testo=await apri(g);}
 catch(x){err.textContent='Password sbagliata.';return;}
 if(ricorda){try{localStorage.setItem(CH,btoa(String.fromCharCode.apply(null,g)));}catch(e){}}
 mostra(testo);});
})();
</script></body></html>
